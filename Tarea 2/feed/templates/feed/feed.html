<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MockTok Feed</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        body::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        body {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        .video-container {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        video {
            height: 100%;
            width: auto;
            max-width: 100%;
            background: black;
            object-fit: cover;
        }
    </style>
</head>
<body>
    {% for video in videos %}
    <div class="video-container">
        <video src="{{ video }}" loop playsinline controls></video>
    </div>
    {% empty %}
    <div class="video-container" style="color:white; font-family:Arial; flex-direction:column;">
        <h2>No hay videos</h2>
        <p>Agrega archivos .mp4, .webm o .ogg a "media/videos"</p>
    </div>
    {% endfor %}

    <script>
        // Intersection Observer for autoplay/pause
        const videos = document.querySelectorAll('video');
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.play().catch(e => console.log("Autoplay prevents execution:", e));
                } else {
                    entry.target.pause();
                }
            });
        }, {
            threshold: 0.6
        });

        videos.forEach(video => {
            observer.observe(video);
            // Click to play/pause
            video.addEventListener('click', function() {
                if (this.paused) {
                    this.play();
                } else {
                    this.pause();
                }
            });
        });
    </script>
</body>
</html>
